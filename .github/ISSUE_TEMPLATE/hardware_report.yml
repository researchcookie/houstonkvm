name: Hardware report
description: Tell us how a capture dongle or CH9329 adapter worked, good or bad.
labels: [hardware]
body:
  - type: markdown
    attributes:
      value: |
        Reports about hardware that works are as useful as reports about
        hardware that doesn't: they build the list of known-good devices.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of device
      options:
        - Capture device
        - CH9329 adapter
        - Other keyboard/mouse path (say below)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and where you bought it
    validations:
      required: true
  - type: input
    id: usbid
    attributes:
      label: USB ID
      description: The line for the device from `lsusb`.
      placeholder: "ID 534d:2109 MacroSilicon USB Video"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Did it work?
      options:
        - Works
        - Partly works
        - Doesn't work
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HoustonKVM version
      description: The output of `HoustonKVM --version`.
    validations:
      required: true
  - type: textarea
    id: formats
    attributes:
      label: Capture formats
      description: For a capture device, the output of `v4l2-ctl --list-formats-ext -d /dev/videoN`.
      render: text
  - type: textarea
    id: selftest
    attributes:
      label: CH9329 self-test
      description: For a CH9329 adapter, the output of `scripts/ch9329-selftest.py`.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: What worked and what didn't
