# HoustonKVM — runtime configuration
# Passed verbatim as arguments to the HoustonKVM binary. Capture device,
# resolution/fps, QEMU/serial input backend, and WebRTC bitrate are NOT
# set here — they are configured per target (Admin -> Targets in the web
# UI, or /api/targets; Owner role required), stored in the database, and
# take effect immediately without a restart.
#
# EnvironmentFile is plain KEY=VALUE (no shell expansion), so add options
# directly on the HOUSTONKVM_OPTS line rather than referencing variables.
#
# Edit this file, then run: systemctl restart houstonkvm
# The full list of options is in houstonkvm(8) and HoustonKVM --help.

# Options: --port=N, --bind=ADDR (default: all interfaces), --secure-cookies, --db=PATH,
# --trusted-proxy=ADDR, --allowed-origin=URL, --ice-server=URL|none,
# --tls=on|off, --https-port=N, --tls-cert=FILE --tls-key=FILE,
# --audit-retention-days=N, --log-format=json (metrics: GET /metrics).
#
# HTTPS: an Owner turns it on under Admin -> Network, where they can also
# make a certificate from HoustonKVM's own certificate authority, get one
# from the company's CA (a CSR), or upload one. The server stays on plain
# HTTP until then. Open the HTTPS port too: firewall-cmd --permanent
# --add-service=houstonkvm && firewall-cmd --reload (8080 and 8443/tcp).
#
# To decide here instead (Ansible, Puppet, Satellite), and have Admin show it
# read-only:
#   --tls=on        HTTPS always on; plain HTTP only redirects to it. Needs a
#                   certificate (below, or made in Admin first), or the
#                   server won't start.
#   --tls=off       Never HTTPS. Also the way back in after an HTTPS mistake:
#                   add it and restart. That turns HTTPS off, and it stays
#                   off when you remove the option again, so you can fix
#                   things in Admin and turn HTTPS on there. And for a
#                   TLS-terminating proxy in front (see below).
#   --https-port=N  The HTTPS port (otherwise the Owner's, 8443 to start).
#   Certificate:    put the chain in /etc/houstonkvm/tls/houstonkvm.crt and
#                   its key in /etc/houstonkvm/tls/houstonkvm.key
#                   (root:houstonkvm, mode 0640), or name other files with
#                   --tls-cert=FILE --tls-key=FILE. After replacing them, run
#                   systemctl reload houstonkvm: open sessions carry on.
#   e.g. HOUSTONKVM_OPTS="--port=8080 --tls=on --db=/var/lib/houstonkvm/houstonkvm.db"
#
# STUN/TURN servers for low-latency video: none by default, and an Owner can
# add them under Admin -> Network. Giving --ice-server here fixes the list
# instead (Admin then shows it read-only), e.g. for config management:
#   --ice-server=turn:USER:PASS@turn.example.com:3478   or   --ice-server=none
#
# Behind a TLS-terminating reverse proxy on this same machine, listen only
# for it, and mark the cookie Secure (only with a proxy doing TLS in front,
# or browsers silently refuse the cookie):
#   HOUSTONKVM_OPTS="--port=8080 --bind=127.0.0.1 --tls=off --secure-cookies --trusted-proxy=127.0.0.1 --db=/var/lib/houstonkvm/houstonkvm.db"
HOUSTONKVM_OPTS="--port=8080 --db=/var/lib/houstonkvm/houstonkvm.db"
